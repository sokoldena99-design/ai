services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  model-download:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b}"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      model-download:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      DATABASE_PATH: /app/data/chat.db
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - chat-data:/app/data

volumes:
  ollama-data:
  chat-data:
